name: build

on:
    push:
        branches: [main]
        paths:
            - .github/**
            - bot/**
            - tests/**
            - pyproject.toml
            - uv.lock
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.3.2

            - name: Install dependencies
              run: uv sync --locked

            - name: Lint
              run: |
                  uv run ruff check .
                  uv run ruff format --check .

            - name: Run tests
              run: |
                  cp config.example.yml config.yml
                  uv run python -m unittest discover
